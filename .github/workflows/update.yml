name: Scholar aktualisieren

on:
  schedule:
    - cron: "17 6-21/3 * * *"   # 6x täglich: 06:17-21:17 UTC alle 3 h (Winterzeit 7-22 Uhr, Sommerzeit 8-23 Uhr)
  workflow_dispatch:         # manuell starten: Actions -> "Scholar aktualisieren" -> Run workflow

permissions:
  contents: write

concurrency:
  group: scholar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, feste Version

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0, feste Version
        with:
          python-version: "3.12"

      - name: Pakete installieren
        # Nur requests (feste Version). scholarly wird bei SerpApi nicht gebraucht.
        run: pip install -r requirements.txt

      - name: Daten abrufen
        # Mit Secret SERPAPI_KEY läuft der Abruf über SerpApi, sonst direkt bei Scholar
        # (das blockiert Google bei GitHub-Servern meist).
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update.py

      - name: Änderungen speichern
        run: |
          git config user.name "scholar-bot"
          git config user.email "scholar-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten aktualisiert $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: clock.json ins Gist kopieren
        # Für die Uhr: Das Repository bleibt privat, nur diese Datei ist per Link lesbar.
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scripts/push_gist.py

      - name: Bei Fehler Bescheid geben
        # Schlägt fehl, wenn Scholar nicht abrufbar war -> GitHub schickt eine E-Mail.
        run: |
          python -c "import json,sys; s=json.load(open('data/status.json')); print(s); sys.exit(0 if s.get('ok') else 1)"
